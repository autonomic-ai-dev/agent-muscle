[verify]
commands = [
  "bash .verify/checks/route_drift.sh",
  "cargo test",
  "cargo check",
  "sh .verify/checks/require_tests.sh ast_guard",
  "sh .verify/checks/require_tests.sh output_slicer",
  "sh .verify/checks/require_tests.sh --test jetstream_consumer_tests",
  "cargo clippy",
  "agent-muscle run",
  ".verify/",
]

[verify.default]
command = ["cargo", "test"]
timeout_secs = 600
